name: Keep backend alive

# Pinguea el backend en Render cada 10 min para evitar el cold start del
# plan free (Render duerme el servicio tras 15 min sin trafico). No
# reemplaza pasar a un plan pago -- solo reduce cuanto tarda el login
# mientras se siga usando el plan free.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 30 https://uca-v2-backend.onrender.com/health || true
